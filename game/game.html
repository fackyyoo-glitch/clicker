<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <div class="header mt-2">
      <input
        class="settings__button"
        id="settings"
        type="image"
        src="/img/pngwing.com.png"
        alt="Настройки"
        class="settings"
      />

      <div class="time">00:00</div>
      <div class="money">
        <span class="header__money p-2" id="money">0</span
        ><img
          src="/img/pngwing.com (6).png"
          alt="Ваше золото"
          class="header__img"
        />
      </div>
    </div>
    <div class="wave__radiant"></div>
    <div class="wave__dire"></div>
    <div class="registration__container">
      <form class="registration" action="#" method="post">
        <label for="username"> Введите ваш никнейм</label>
        <input class="nickname" type="text" id="nickname" name="nickname" />

        <br />

        <input
          class="post__button"
          type="submit"
          value="Закинуть жестко"
          disabled
        />
      </form>
    </div>
    <div class="shop__container">
      <input
        class="close__button"
        id="close"
        type="image"
        src="/img/close.png"
        alt="Закрыть"
      />
    </div>
    <div class="button__container">
      <button class="button shop">Магазин</button>

      <button class="button wave">Добавить волну крипов</button>

      <button class="button glif">Укрпекление строений</button>
    </div>
  </body>
</html>
